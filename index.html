<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CasinoValues — JJK Trading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060a10;
  --surface: #0d1420;
  --surface2: #111c2d;
  --surface3: #162234;
  --border: rgba(255,255,255,0.07);
  --border-accent: rgba(124,92,255,0.45);
  --accent: #7c5cff;
  --accent2: #a78bfa;
  --text: #f0f4ff;
  --muted: rgba(240,244,255,0.45);
  --faint: rgba(240,244,255,0.12);
  --font-display: 'Bebas Neue', sans-serif;
  --font-body: 'DM Sans', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --r: 18px;
  --r-sm: 10px;
  --common:    #c8c8c8;
  --rare:      #4da3ff;
  --epic:      #c084fc;
  --legendary: #fbbf24;
  --mythic:    #f87171;
  --jackpot:   #fff;
  --universal: #e879f9;
  --rise: #4ade80;
  --fall: #f87171;
  --stable: #94a3b8;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ─── NOISE OVERLAY ─── */
body::before {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  opacity: 0.4;
}
.glow-orb { position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0; opacity: 0.12; }
.glow-orb.a { width: 600px; height: 600px; background: #7c5cff; top: -200px; left: -150px; }
.glow-orb.b { width: 400px; height: 400px; background: #c084fc; bottom: -100px; right: -100px; }

/* ─── LAYOUT ─── */
.shell { position: relative; z-index: 1; max-width: 1380px; margin: 0 auto; padding: 0 28px 100px; }

/* ─── HEADER ─── */
header { display: flex; align-items: center; justify-content: space-between; padding: 28px 0 0; gap: 16px; flex-wrap: wrap; }
.logo { font-family: var(--font-display); font-size: clamp(42px,7vw,72px); letter-spacing: 2px; line-height: 1; color: var(--text); }
.logo span { color: var(--accent); }
.logo-sub { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: var(--muted); font-weight: 500; margin-top: 4px; }
.header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

/* ─── SEARCH ─── */
.search-wrap { position: relative; }
.search-wrap svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search { width: 340px; height: 48px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 0 20px 0 46px; color: var(--text); font-family: var(--font-body); font-size: 14px; outline: none; transition: border-color .2s, box-shadow .2s; }
.search::placeholder { color: var(--muted); }
.search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,92,255,.15); }

/* ─── STATS BAR ─── */
.stats-bar { display: flex; gap: 12px; margin: 20px 0 0; flex-wrap: wrap; }
.stat-pill { background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 8px 18px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.stat-pill .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.stat-pill .val { color: var(--text); font-weight: 700; }

/* ─── NAV TABS ─── */
nav { display: flex; gap: 6px; margin: 24px 0 24px; flex-wrap: wrap; align-items: center; }
.tab { background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 10px 22px; border-radius: var(--r); cursor: pointer; font-family: var(--font-body); font-size: 13px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; transition: all .2s; }
.tab:hover { color: var(--text); border-color: var(--border-accent); }
.tab.active { background: var(--accent); color: #fff; border-color: transparent; box-shadow: 0 4px 24px rgba(124,92,255,.4); }

/* ─── CONTROLS BAR ─── */
.controls-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: space-between; }
.controls-left { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filter-btn { background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 8px 16px; border-radius: var(--r-sm); cursor: pointer; font-family: var(--font-body); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; transition: all .15s; }
.filter-btn:hover { color: var(--text); border-color: var(--border-accent); }
.filter-btn.active { color: #fff; border-color: transparent; }
.filter-btn.active.f-common    { background: rgba(200,200,200,.2); }
.filter-btn.active.f-rare      { background: rgba(77,163,255,.2); border-color: rgba(77,163,255,.4); color: var(--rare); }
.filter-btn.active.f-epic      { background: rgba(192,132,252,.2); border-color: rgba(192,132,252,.4); color: var(--epic); }
.filter-btn.active.f-legendary { background: rgba(251,191,36,.15); border-color: rgba(251,191,36,.4); color: var(--legendary); }
.filter-btn.active.f-mythic    { background: rgba(248,113,113,.15); border-color: rgba(248,113,113,.4); color: var(--mythic); }
.filter-btn.active.f-jackpot   { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.3); color: #fff; }
.filter-btn.active.f-universal { background: rgba(232,121,249,.15); border-color: rgba(232,121,249,.4); color: var(--universal); }
.controls-right { display: flex; gap: 8px; align-items: center; }
.sort-select { background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 8px 14px; border-radius: var(--r-sm); font-family: var(--font-body); font-size: 12px; font-weight: 700; cursor: pointer; outline: none; transition: all .15s; }
.sort-select:focus { border-color: var(--accent); }
.view-toggle { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden; }
.view-btn { padding: 8px 12px; cursor: pointer; color: var(--muted); border: none; background: none; transition: all .15s; font-size: 14px; }
.view-btn.active { background: var(--accent); color: #fff; }

/* ─── RARITY BADGE ─── */
.badge { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; font-family: var(--font-mono); white-space: nowrap; }
.badge.common    { background: rgba(200,200,200,.15); color: var(--common); border: 1px solid rgba(200,200,200,.25); }
.badge.rare      { background: rgba(77,163,255,.15);  color: var(--rare);   border: 1px solid rgba(77,163,255,.3); }
.badge.epic      { background: rgba(192,132,252,.15); color: var(--epic);   border: 1px solid rgba(192,132,252,.3); }
.badge.legendary { background: rgba(251,191,36,.12);  color: var(--legendary); border: 1px solid rgba(251,191,36,.3); }
.badge.mythic    { background: rgba(248,113,113,.12); color: var(--mythic); border: 1px solid rgba(248,113,113,.3); }
.badge.jackpot   { border: 1px solid rgba(255,255,255,.3); }
.badge.universal { border: 1px solid rgba(232,121,249,.3); }

/* ─── RAINBOW JACKPOT ─── */
@keyframes rainbow-shift {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
@keyframes rainbow-text {
  0%   { filter: hue-rotate(0deg) brightness(1.2); }
  100% { filter: hue-rotate(360deg) brightness(1.2); }
}
.badge.jackpot {
  background: linear-gradient(90deg, #ff0080, #ff8800, #ffe600, #00ff80, #00bfff, #8800ff, #ff0080);
  background-size: 300% 300%;
  animation: rainbow-shift 3s ease infinite;
  color: #fff;
  text-shadow: 0 0 8px rgba(0,0,0,.5);
  border: none;
}
.val.jackpot {
  background: linear-gradient(90deg, #ff6ec7, #ffb347, #ffe066, #b2ff66, #66eaff, #c084fc, #ff6ec7);
  background-size: 300%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: rainbow-shift 3s ease infinite;
}
.card-jackpot-glow { animation: jackpot-pulse 2.5s ease-in-out infinite; }
@keyframes jackpot-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,100,200,.0), 0 0 30px rgba(255,100,100,.08); }
  50%       { box-shadow: 0 0 0 2px rgba(255,100,200,.18), 0 0 40px rgba(100,200,255,.15); }
}

/* ─── GALAXY UNIVERSAL ─── */
@keyframes galaxy-rotate {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
@keyframes galaxy-glow {
  0%, 100% { box-shadow: 0 0 20px rgba(168,85,247,.12), 0 0 0 0 rgba(232,121,249,.0); }
  50%       { box-shadow: 0 0 40px rgba(168,85,247,.3), 0 0 0 3px rgba(232,121,249,.12); }
}
.badge.universal {
  background: linear-gradient(135deg, #1a0533, #3b0764, #6d28d9, #9333ea, #c084fc, #1a0533, #0f172a, #1e1b4b, #4c1d95);
  background-size: 400% 400%;
  animation: galaxy-rotate 5s ease infinite;
  color: #f0abfc;
  text-shadow: 0 0 10px rgba(232,121,249,.8);
  border-color: rgba(192,132,252,.6);
  position: relative;
  overflow: hidden;
}
.badge.universal::after {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(circle at 30% 40%, rgba(255,255,255,.18) 0%, transparent 60%),
              radial-gradient(circle at 70% 60%, rgba(192,132,252,.2) 0%, transparent 50%);
  pointer-events: none;
}
.val.universal {
  background: linear-gradient(90deg, #c084fc, #e879f9, #a855f7, #818cf8, #e879f9, #c084fc);
  background-size: 300%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: galaxy-rotate 4s ease infinite;
  filter: drop-shadow(0 0 8px rgba(232,121,249,.5));
}
.card-universal-glow { animation: galaxy-glow 3s ease-in-out infinite; }

/* ─── VALUE COLORS ─── */
.val.common    { color: var(--common); }
.val.rare      { color: var(--rare); }
.val.epic      { color: var(--epic); }
.val.legendary { color: var(--legendary); }
.val.mythic    { color: var(--mythic); }

/* ─── TREND INDICATORS ─── */
.trend { font-size: 11px; font-weight: 700; font-family: var(--font-mono); display: flex; align-items: center; gap: 4px; }
.trend.up   { color: var(--rise); }
.trend.down { color: var(--fall); }
.trend.flat { color: var(--stable); }

/* ─── DEMAND DOTS ─── */
.demand-bar { display: flex; gap: 3px; align-items: center; }
.demand-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--surface3); transition: background .2s; }
.demand-dot.filled { background: var(--accent2); }
.demand-dot.high   { background: var(--rise); }

/* ─── CARD GRID ─── */
.items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 20px; }
.item-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; transition: transform .25s, border-color .25s, box-shadow .25s; cursor: default; animation: fadeUp .35s ease both; }
.item-card:hover { transform: translateY(-6px) scale(1.015); border-color: var(--border-accent); box-shadow: 0 12px 48px rgba(124,92,255,.18); }
@keyframes fadeUp { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
.card-img { width: 100%; height: 190px; background: var(--surface2); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
.card-img img { width: 100%; height: 100%; object-fit: contain; padding: 16px; }
.card-img-overlay { position: absolute; inset: 0; background: linear-gradient(to top, var(--surface) 0%, transparent 55%); pointer-events: none; }
.card-body { padding: 14px 16px 18px; }
.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.card-name { font-family: var(--font-display); font-size: 24px; letter-spacing: .5px; line-height: 1; color: var(--text); }
.card-desc { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 12px; min-height: 34px; }
.card-footer { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 10px; gap: 8px; }
.card-value { font-family: var(--font-mono); font-size: 20px; font-weight: 500; }
.card-meta { display: flex; align-items: center; gap: 8px; }
.copy-btn { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; transition: all .15s; flex-shrink: 0; }
.copy-btn:hover { border-color: var(--accent2); color: var(--accent2); }

/* ─── LIST VIEW ─── */
.items-list { display: flex; flex-direction: column; gap: 4px; }
.list-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 12px 18px; display: flex; align-items: center; gap: 14px; cursor: default; transition: border-color .18s, background .18s; animation: fadeUp .25s ease both; }
.list-item:hover { border-color: var(--border-accent); background: var(--surface2); }
.list-img { width: 42px; height: 42px; object-fit: contain; flex-shrink: 0; }
.list-name { font-family: var(--font-display); font-size: 20px; flex: 1; min-width: 0; }
.list-desc { font-size: 12px; color: var(--muted); flex: 2; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-right { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
.list-value { font-family: var(--font-mono); font-size: 18px; font-weight: 500; }

/* ─── FAMILIES GRID ─── */
.families-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
.fam-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 24px 16px; text-align: center; cursor: default; transition: transform .2s, border-color .2s, box-shadow .2s; animation: fadeUp .35s ease both; position: relative; overflow: hidden; }
.fam-card::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 0%, var(--glow-color, rgba(124,92,255,.08)), transparent 70%); pointer-events: none; }
.fam-card:hover { transform: translateY(-4px); border-color: var(--border-accent); box-shadow: 0 8px 32px rgba(124,92,255,.14); }
.fam-name { font-family: var(--font-display); font-size: 28px; letter-spacing: .5px; margin-bottom: 10px; }
.fam-val  { font-size: 12px; color: var(--muted); margin-top: 10px; }

/* ─── PAGE ─── */
.page { display: none; }
.page.active { display: block; }

/* ─── CALCULATOR ─── */
.calc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
@media (max-width: 680px) { .calc-grid { grid-template-columns: 1fr; } }
.calc-side { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 22px; }
.calc-side-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.side-label { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-family: var(--font-mono); }
.side-total { font-family: var(--font-mono); font-size: 18px; font-weight: 500; color: var(--accent2); }
.slot-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
.slot { aspect-ratio: 1; background: var(--surface2); border: 1px dashed rgba(124,92,255,.25); border-radius: var(--r-sm); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all .18s; position: relative; overflow: hidden; font-size: 11px; color: var(--muted); gap: 4px; }
.slot:hover { border-color: var(--accent); background: rgba(124,92,255,.08); color: var(--text); }
.slot.filled { border-style: solid; border-color: rgba(124,92,255,.35); background: var(--surface2); cursor: default; }
.slot .slot-plus { font-size: 20px; opacity: .4; }
.slot img { width: 44px; height: 44px; object-fit: contain; }
.slot .slot-name { font-size: 9px; font-weight: 700; text-align: center; padding: 0 4px; line-height: 1.2; }
.slot .slot-val  { font-size: 9px; color: var(--accent2); font-family: var(--font-mono); }
.slot .slot-rm { position: absolute; top: 3px; right: 3px; background: rgba(248,113,113,.15); color: #f87171; border: none; border-radius: 50%; width: 16px; height: 16px; font-size: 9px; cursor: pointer; display: none; align-items: center; justify-content: center; }
.slot.filled:hover .slot-rm { display: flex; }
.result-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 26px 28px; margin-bottom: 20px; }
.result-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.verdict { font-family: var(--font-mono); font-size: 14px; font-weight: 500; padding: 8px 18px; border-radius: var(--r-sm); }
.verdict.fair  { background: rgba(124,92,255,.12); color: var(--accent2); border: 1px solid rgba(124,92,255,.3); }
.verdict.win   { background: rgba(74,222,128,.1);  color: #4ade80;        border: 1px solid rgba(74,222,128,.3); }
.verdict.lose  { background: rgba(248,113,113,.1); color: #f87171;        border: 1px solid rgba(248,113,113,.3); }
.reset-btn { background: none; border: 1px solid rgba(248,113,113,.25); color: #f87171; padding: 8px 18px; border-radius: var(--r-sm); cursor: pointer; font-family: var(--font-body); font-size: 13px; font-weight: 700; transition: all .18s; }
.reset-btn:hover { background: rgba(248,113,113,.08); border-color: #f87171; }
.vs-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
.vs-num { font-family: var(--font-mono); font-size: 30px; font-weight: 500; }
.vs-you  { color: var(--accent2); }
.vs-them { color: var(--epic); }
.vs-sep  { font-size: 14px; color: var(--muted); font-weight: 700; }
.bar-track { height: 8px; background: var(--surface2); border-radius: 999px; overflow: hidden; position: relative; }
.bar-you  { height: 100%; background: var(--accent); float: left; transition: width .5s cubic-bezier(.4,0,.2,1); }
.bar-them { height: 100%; background: var(--epic); float: left; transition: width .5s cubic-bezier(.4,0,.2,1); }
.bar-labels { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: var(--muted); font-family: var(--font-mono); }

/* ─── DIFF INDICATOR ─── */
.diff-info { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.diff-label { font-size: 12px; color: var(--muted); }
.diff-val { font-family: var(--font-mono); font-size: 16px; font-weight: 500; }

/* ─── MODAL ─── */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.75); backdrop-filter: blur(8px); z-index: 200; display: none; align-items: center; justify-content: center; }
.modal-bg.open { display: flex; }
.modal-box { background: var(--surface); border: 1px solid var(--border-accent); border-radius: var(--r); padding: 28px; width: min(480px, 92vw); max-height: 80vh; display: flex; flex-direction: column; gap: 14px; animation: modalIn .2s ease; }
@keyframes modalIn { from { opacity: 0; transform: scale(.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.modal-title { font-family: var(--font-display); font-size: 28px; letter-spacing: .5px; color: var(--accent2); }
.modal-search-wrap { position: relative; }
.modal-search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.modal-search { width: 100%; height: 42px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 0 14px 0 40px; color: var(--text); font-family: var(--font-body); font-size: 14px; outline: none; transition: border-color .18s; }
.modal-search:focus { border-color: var(--accent); }
.modal-search::placeholder { color: var(--muted); }
.modal-list { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 6px; }
.modal-item { display: flex; align-items: center; gap: 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 10px 14px; cursor: pointer; transition: all .15s; }
.modal-item:hover { border-color: var(--border-accent); background: rgba(124,92,255,.06); }
.modal-item img { width: 38px; height: 38px; object-fit: contain; flex-shrink: 0; }
.modal-item-info { flex: 1; }
.modal-item-name { font-size: 14px; font-weight: 700; }
.modal-item-val { font-size: 12px; color: var(--accent2); font-family: var(--font-mono); }
.modal-close-btn { background: none; border: 1px solid var(--border); color: var(--muted); padding: 8px 18px; border-radius: var(--r-sm); cursor: pointer; font-family: var(--font-body); font-size: 13px; font-weight: 700; align-self: flex-end; transition: all .15s; }
.modal-close-btn:hover { border-color: var(--accent2); color: var(--text); }

/* ─── TOAST ─── */
#toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--surface); border: 1px solid var(--accent); color: var(--accent2); padding: 12px 24px; border-radius: 999px; font-family: var(--font-mono); font-size: 13px; z-index: 999; opacity: 0; transition: all .3s cubic-bezier(.34,1.56,.64,1); pointer-events: none; white-space: nowrap; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ─── EMPTY STATE ─── */
.empty-state { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 15px; grid-column: 1 / -1; }
.empty-state div { font-size: 36px; margin-bottom: 12px; opacity: .5; }

/* ─── ITEM DETAIL PANEL ─── */
.detail-panel { position: fixed; top: 0; right: -420px; width: 400px; height: 100vh; background: var(--surface); border-left: 1px solid var(--border-accent); z-index: 150; overflow-y: auto; transition: right .3s cubic-bezier(.4,0,.2,1); display: flex; flex-direction: column; }
.detail-panel.open { right: 0; }
.detail-overlay { position: fixed; inset: 0; z-index: 140; display: none; }
.detail-overlay.open { display: block; }
.detail-header { padding: 24px 24px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.detail-close { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 50%; width: 32px; height: 32px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: all .15s; flex-shrink: 0; }
.detail-close:hover { border-color: var(--accent2); color: var(--text); }
.detail-img { width: 100%; height: 220px; object-fit: contain; padding: 24px; background: var(--surface2); }
.detail-body { padding: 20px 24px 32px; flex: 1; }
.detail-name { font-family: var(--font-display); font-size: 42px; line-height: 1; margin-bottom: 8px; }
.detail-desc { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
.detail-stats { display: flex; flex-direction: column; gap: 10px; }
.detail-stat { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--surface2); border-radius: var(--r-sm); }
.detail-stat-label { font-size: 12px; color: var(--muted); font-family: var(--font-mono); letter-spacing: .5px; }
.detail-stat-val { font-size: 14px; font-weight: 700; font-family: var(--font-mono); }

/* ─── RESPONSIVE ─── */
@media (max-width: 600px) {
  .shell { padding: 0 16px 80px; }
  .logo  { font-size: 48px; }
  .items-grid { grid-template-columns: 1fr; }
  .search { width: 100%; }
  .detail-panel { width: 100%; right: -100%; }
  .list-desc { display: none; }
}

/* ─── STAGGER ─── */
.item-card:nth-child(1)  { animation-delay:.02s } .item-card:nth-child(2)  { animation-delay:.04s }
.item-card:nth-child(3)  { animation-delay:.06s } .item-card:nth-child(4)  { animation-delay:.08s }
.item-card:nth-child(5)  { animation-delay:.10s } .item-card:nth-child(6)  { animation-delay:.12s }
.item-card:nth-child(7)  { animation-delay:.14s } .item-card:nth-child(8)  { animation-delay:.16s }
.item-card:nth-child(9)  { animation-delay:.18s } .item-card:nth-child(10) { animation-delay:.20s }
.item-card:nth-child(11) { animation-delay:.22s } .item-card:nth-child(12) { animation-delay:.24s }
.item-card:nth-child(13) { animation-delay:.26s }
.fam-card:nth-child(1)  { animation-delay:.02s } .fam-card:nth-child(2)  { animation-delay:.04s }
.fam-card:nth-child(3)  { animation-delay:.06s } .fam-card:nth-child(4)  { animation-delay:.08s }
.fam-card:nth-child(5)  { animation-delay:.10s } .fam-card:nth-child(6)  { animation-delay:.12s }
.fam-card:nth-child(7)  { animation-delay:.14s } .fam-card:nth-child(8)  { animation-delay:.16s }
.fam-card:nth-child(9)  { animation-delay:.18s } .fam-card:nth-child(10) { animation-delay:.20s }
.fam-card:nth-child(11) { animation-delay:.22s } .fam-card:nth-child(12) { animation-delay:.24s }
</style>
</head>
<body>

<div class="glow-orb a"></div>
<div class="glow-orb b"></div>
<div id="toast"></div>

<!-- DETAIL PANEL OVERLAY -->
<div class="detail-overlay" id="detailOverlay"></div>

<!-- DETAIL PANEL -->
<div class="detail-panel" id="detailPanel">
  <div class="detail-header">
    <span class="badge" id="detailBadge">—</span>
    <button class="detail-close" id="detailClose">✕</button>
  </div>
  <img class="detail-img" id="detailImg" src="" alt="" onerror="this.style.opacity=0.15">
  <div class="detail-body">
    <div class="detail-name" id="detailName">—</div>
    <div class="detail-desc" id="detailDesc">—</div>
    <div class="detail-stats" id="detailStats"></div>
  </div>
</div>

<div class="shell">
  <header>
    <div>
      <div class="logo">CASINO<span>VALUES</span></div>
      <div class="logo-sub">Lol0's Casino Trading Reference</div>
    </div>
    <div class="header-right">
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input class="search" id="searchInput" type="text" placeholder="Rechercher un objet...">
      </div>
    </div>
  </header>

  <!-- STATS BAR -->
  <div class="stats-bar" id="statsBar"></div>

  <nav>
    <button class="tab active" data-page="items">Objets</button>
    <button class="tab" data-page="families">Familles</button>
    <button class="tab" data-page="calculator">Calculateur</button>
  </nav>

  <!-- ITEMS PAGE -->
  <div class="page active" id="page-items">
    <div class="controls-bar">
      <div class="controls-left" id="rarityFilters">
        <button class="filter-btn active" data-rarity="all">Tous</button>
        <button class="filter-btn f-common"    data-rarity="common">Commun</button>
        <button class="filter-btn f-rare"      data-rarity="rare">Rare</button>
        <button class="filter-btn f-epic"      data-rarity="epic">Épique</button>
        <button class="filter-btn f-legendary" data-rarity="legendary">Légendaire</button>
        <button class="filter-btn f-mythic"    data-rarity="mythic">Mythique</button>
        <button class="filter-btn f-jackpot"   data-rarity="jackpot">Jackpot</button>
        <button class="filter-btn f-universal" data-rarity="universal">Universel</button>
      </div>
      <div class="controls-right">
        <select class="sort-select" id="sortSelect">
          <option value="default">Tri: Défaut</option>
          <option value="value-desc">Valeur ↓</option>
          <option value="value-asc">Valeur ↑</option>
          <option value="name-asc">Nom A→Z</option>
          <option value="name-desc">Nom Z→A</option>
          <option value="rarity">Rareté</option>
        </select>
        <div class="view-toggle">
          <button class="view-btn active" id="viewGrid" title="Grille">⊞</button>
          <button class="view-btn" id="viewList" title="Liste">☰</button>
        </div>
      </div>
    </div>
    <div id="itemsContainer"></div>
  </div>

  <!-- FAMILIES PAGE -->
  <div class="page" id="page-families">
    <div class="families-grid" id="familiesGrid"></div>
  </div>

  <!-- CALCULATOR PAGE -->
  <div class="page" id="page-calculator">
    <div class="calc-grid">
      <div class="calc-side">
        <div class="calc-side-header">
          <span class="side-label">Toi</span>
          <span class="side-total" id="youTotal">0</span>
        </div>
        <div class="slot-grid" id="youSlots"></div>
      </div>
      <div class="calc-side">
        <div class="calc-side-header">
          <span class="side-label">Eux</span>
          <span class="side-total" id="themTotal">0</span>
        </div>
        <div class="slot-grid" id="themSlots"></div>
      </div>
    </div>

    <div class="result-panel">
      <div class="result-row">
        <span class="verdict fair" id="verdict">⚖ Équitable</span>
        <button class="reset-btn" id="resetBtn">✕ Réinitialiser</button>
      </div>
      <div class="vs-row">
        <div style="text-align:center">
          <div style="font-size:11px;color:var(--muted);font-family:var(--font-mono);letter-spacing:1px;margin-bottom:4px;">TOI</div>
          <span class="vs-num vs-you" id="vsYou">0</span>
        </div>
        <span class="vs-sep">VS</span>
        <div style="text-align:center">
          <div style="font-size:11px;color:var(--muted);font-family:var(--font-mono);letter-spacing:1px;margin-bottom:4px;">EUX</div>
          <span class="vs-num vs-them" id="vsThem">0</span>
        </div>
      </div>
      <div class="bar-track">
        <div class="bar-you"  id="barYou"  style="width:50%"></div>
        <div class="bar-them" id="barThem" style="width:50%"></div>
      </div>
      <div class="bar-labels">
        <span id="barPctYou">50%</span>
        <span id="barPctThem">50%</span>
      </div>
      <div class="diff-info">
        <span class="diff-label">Différence de valeur</span>
        <span class="diff-val" id="diffVal">—</span>
      </div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);">
      <span>💡 Clique sur un slot vide pour ajouter un objet</span>
      <span>·</span>
      <span>Survole un objet rempli pour le supprimer</span>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg">
  <div class="modal-box">
    <div class="modal-title">Ajouter un objet</div>
    <div class="modal-search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input class="modal-search" id="modalSearch" type="text" placeholder="Rechercher...">
    </div>
    <div class="modal-list" id="modalList"></div>
    <button class="modal-close-btn" id="modalClose">Fermer</button>
  </div>
</div>

<script>
const ITEMS = [
  { name:"Satoru Box",      value:70000,    rarity:"common",    img:"images/SatoruBox.webp",    desc:"Petite boite, ayant des chances de décupler sa valeur.", demand:2, trend:"up" },
  { name:"Reset Cooldown",  value:25000,    rarity:"common",    img:"images/reset.webp",         desc:"Abilité de retirer le cooldown d'une attaque non ultime.", demand:2, trend:"flat" },
  { name:"Lucky Spin",      value:90000,    rarity:"rare",      img:"images/LuckySpin.webp",     desc:"Un ticket famille premium pour augmenter ses chances.", demand:3, trend:"flat" },
  { name:"Reset Pouvoir",   value:1000000,  rarity:"rare",      img:"images/remove.webp",        desc:"Un jeton qui te permet de retirer ton pouvoir.", demand:3, trend:"up" },
  { name:"Sukuna Finger",   value:2000000,  rarity:"legendary", img:"images/SukunaFinger.webp",  desc:"Une relique légendaire et maudite possédant une grande valeur.", demand:4, trend:"flat" },
  { name:"VIP",             value:3000000,  rarity:"legendary", img:"images/vip.webp",           desc:"Un role pour que les plus riches s'enrichissent encore plus.", demand:4, trend:"up" },
  { name:"Satoru Gojo",     value:1000000,  rarity:"legendary", img:"images/SatoruGojo.webp",    desc:"Le pouvoir légendaire préféré de la majoritée des gens.", demand:5, trend:"up" },
  { name:"Choso",           value:4500000,  rarity:"mythic",    img:"images/Choso.webp",         desc:"Une nouvelle technique mythique ayant une valeure stable.", demand:3, trend:"down" },
  { name:"Hajime Kashimo",  value:6900000,  rarity:"mythic",    img:"images/Kashimo.webp",       desc:"Un pouvoir électriquement mythique avec une valeure élevée.", demand:4, trend:"down" },
  { name:"Queen Of Curses", value:9000000,  rarity:"jackpot",   img:"images/Yuta.webp",          desc:"Une technique extrêmement offensive avec une très grande demande.", demand:5, trend:"up" },
  { name:"Ten Shadow",      value:9000000,  rarity:"jackpot",   img:"images/Megumi.webp",        desc:"Une technique assez faible comparée aux autres jackpots.", demand:4, trend:"flat" },
  { name:"Yuki Tsukumo",    value:9500000,  rarity:"jackpot",   img:"images/Yuki.webp",          desc:"Une toute nouvelle technique extrêmement puissante.", demand:5, trend:"flat" },
  { name:"Mahoraga",        value:Infinity, rarity:"universal", img:"images/mahoraga.webp",      desc:"2 copies existent seulement — tellement rare qu'il est inestimable.", demand:5, trend:"flat" },
];

const FAMILIES = [
  { name:"Momo",     rarity:"common",    glow:"rgba(200,200,200,.06)" },
  { name:"Miwa",     rarity:"common",    glow:"rgba(200,200,200,.06)" },
  { name:"Inumaki",  rarity:"rare",      glow:"rgba(77,163,255,.06)" },
  { name:"Kugisaki", rarity:"rare",      glow:"rgba(77,163,255,.06)" },
  { name:"Kamo",     rarity:"epic",      glow:"rgba(192,132,252,.06)" },
  { name:"Itadori",  rarity:"epic",      glow:"rgba(192,132,252,.06)" },
  { name:"Hakari",   rarity:"legendary", glow:"rgba(251,191,36,.07)" },
  { name:"Tsukumo",  rarity:"legendary", glow:"rgba(251,191,36,.07)" },
  { name:"Zenin",    rarity:"legendary", glow:"rgba(251,191,36,.07)" },
  { name:"Sukuna",   rarity:"mythic",    glow:"rgba(248,113,113,.07)" },
  { name:"Gojo",     rarity:"mythic",    glow:"rgba(248,113,113,.07)" },
  { name:"Okkotsu",  rarity:"mythic",    glow:"rgba(248,113,113,.07)" },
];

const RARITY_LABEL = { common:"Commun", rare:"Rare", epic:"Épique", legendary:"Légendaire", mythic:"Mythique", jackpot:"Jackpot", universal:"Universel" };
const RARITY_ORDER = { common:0, rare:1, epic:2, legendary:3, mythic:4, jackpot:5, universal:6 };

let currentFilter = "all";
let currentSort = "default";
let currentView = "grid";

function fmtVal(v) {
  if (!isFinite(v)) return "INF";
  if (v >= 1e6) return (v/1e6 % 1 === 0 ? v/1e6 : (v/1e6).toFixed(1)) + "M";
  if (v >= 1000) return (v/1000 % 1 === 0 ? v/1000 : (v/1000).toFixed(1)) + "K";
  return v.toString();
}

function trendHTML(t) {
  if (t === "up")   return `<span class="trend up">↑ Hausse</span>`;
  if (t === "down") return `<span class="trend down">↓ Baisse</span>`;
  return `<span class="trend flat">→ Stable</span>`;
}

function demandHTML(d, rarity) {
  const cls = d >= 4 ? "high" : d >= 2 ? "filled" : "";
  let dots = "";
  for (let i = 1; i <= 5; i++) dots += `<div class="demand-dot${i <= d ? ' ' + cls : ''}"></div>`;
  return `<div class="demand-bar" title="Demande: ${d}/5">${dots}</div>`;
}

function cardGlowClass(rarity) {
  if (rarity === "jackpot") return "card-jackpot-glow";
  if (rarity === "universal") return "card-universal-glow";
  return "";
}

/* ─── STATS BAR ─── */
function buildStatsBar() {
  const total = ITEMS.length;
  const byRarity = {};
  ITEMS.forEach(it => byRarity[it.rarity] = (byRarity[it.rarity] || 0) + 1);
  const topVal = ITEMS.filter(it => isFinite(it.value)).sort((a,b) => b.value - a.value)[0];
  const rising = ITEMS.filter(it => it.trend === "up").length;
  document.getElementById("statsBar").innerHTML = `
    <div class="stat-pill"><span class="dot" style="background:var(--accent)"></span>${total} <span class="val">objets</span></div>
    <div class="stat-pill"><span class="dot" style="background:var(--legendary)"></span>${byRarity.legendary||0} <span class="val">Légendaires</span></div>
    <div class="stat-pill"><span class="dot" style="background:var(--mythic)"></span>${(byRarity.mythic||0)+(byRarity.jackpot||0)} <span class="val">Mythique+</span></div>
    <div class="stat-pill"><span class="dot" style="background:var(--rise)"></span>${rising} <span class="val">en hausse</span></div>
    <div class="stat-pill"><span class="dot" style="background:var(--universal)"></span>Top: <span class="val">${topVal.name}</span></div>`;
}

/* ─── FILTER & SORT ITEMS ─── */
function getFilteredSorted(query = "") {
  const q = query.toLowerCase();
  let arr = ITEMS.filter(it => {
    const matchQ = !q || it.name.toLowerCase().includes(q) || it.desc.toLowerCase().includes(q) || RARITY_LABEL[it.rarity].toLowerCase().includes(q);
    const matchR = currentFilter === "all" || it.rarity === currentFilter;
    return matchQ && matchR;
  });
  switch (currentSort) {
    case "value-desc": arr.sort((a,b) => (isFinite(b.value)?b.value:Infinity)-(isFinite(a.value)?a.value:Infinity)); break;
    case "value-asc":  arr.sort((a,b) => (isFinite(a.value)?a.value:Infinity)-(isFinite(b.value)?b.value:Infinity)); break;
    case "name-asc":   arr.sort((a,b) => a.name.localeCompare(b.name)); break;
    case "name-desc":  arr.sort((a,b) => b.name.localeCompare(a.name)); break;
    case "rarity":     arr.sort((a,b) => RARITY_ORDER[b.rarity]-RARITY_ORDER[a.rarity]); break;
  }
  return arr;
}

/* ─── BUILD ITEMS ─── */
function buildItems(query = "") {
  const filtered = getFilteredSorted(query);
  const container = document.getElementById("itemsContainer");
  if (filtered.length === 0) {
    container.innerHTML = `<div style="text-align:center;padding:60px 20px;color:var(--muted);font-size:15px;"><div style="font-size:36px;margin-bottom:12px;opacity:.5">🔍</div>Aucun objet trouvé.</div>`;
    return;
  }
  if (currentView === "grid") {
    container.innerHTML = `<div class="items-grid">${filtered.map(it => `
      <div class="item-card ${cardGlowClass(it.rarity)}" data-name="${it.name}" style="cursor:pointer">
        <div class="card-img">
          <img src="${it.img}" alt="${it.name}" loading="lazy" onerror="this.style.opacity=0.15">
          <div class="card-img-overlay"></div>
        </div>
        <div class="card-body">
          <div class="card-top">
            <div class="card-name">${it.name}</div>
            <span class="badge ${it.rarity}">${RARITY_LABEL[it.rarity]}</span>
          </div>
          <p class="card-desc">${it.desc}</p>
          <div class="card-footer">
            <span class="card-value val ${it.rarity}">${fmtVal(it.value)}</span>
            <div class="card-meta">
              ${trendHTML(it.trend)}
              ${demandHTML(it.demand, it.rarity)}
              <button class="copy-btn" data-value="${isFinite(it.value)?it.value:''}" data-name="${it.name}" title="Copier la valeur">⎘</button>
            </div>
          </div>
        </div>
      </div>`).join("")}</div>`;
  } else {
    container.innerHTML = `<div class="items-list">${filtered.map(it => `
      <div class="list-item ${cardGlowClass(it.rarity)}" data-name="${it.name}" style="cursor:pointer">
        <img class="list-img" src="${it.img}" alt="${it.name}" onerror="this.style.opacity=0.15">
        <div class="list-name">${it.name}</div>
        <div class="list-desc">${it.desc}</div>
        <div class="list-right">
          ${trendHTML(it.trend)}
          ${demandHTML(it.demand, it.rarity)}
          <span class="badge ${it.rarity}">${RARITY_LABEL[it.rarity]}</span>
          <span class="list-value val ${it.rarity}">${fmtVal(it.value)}</span>
          <button class="copy-btn" data-value="${isFinite(it.value)?it.value:''}" data-name="${it.name}" title="Copier la valeur">⎘</button>
        </div>
      </div>`).join("")}</div>`;
  }

  // copy buttons
  container.querySelectorAll(".copy-btn").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      const v = btn.dataset.value ? fmtVal(+btn.dataset.value) : "INF";
      navigator.clipboard?.writeText(v).catch(()=>{});
      showToast(`Valeur copiée : ${v}`);
    });
  });

  // detail panel on card click
  container.querySelectorAll("[data-name]").forEach(el => {
    el.addEventListener("click", (e) => {
      if (e.target.classList.contains("copy-btn")) return;
      const it = ITEMS.find(i => i.name === el.dataset.name);
      if (it) openDetail(it);
    });
  });
}

/* ─── DETAIL PANEL ─── */
function openDetail(it) {
  document.getElementById("detailBadge").className = `badge ${it.rarity}`;
  document.getElementById("detailBadge").textContent = RARITY_LABEL[it.rarity];
  document.getElementById("detailImg").src = it.img;
  document.getElementById("detailImg").alt = it.name;
  document.getElementById("detailName").textContent = it.name;
  document.getElementById("detailDesc").textContent = it.desc;
  const trendTxt = it.trend === "up" ? "↑ Hausse" : it.trend === "down" ? "↓ Baisse" : "→ Stable";
  const trendCls = it.trend === "up" ? "var(--rise)" : it.trend === "down" ? "var(--fall)" : "var(--stable)";
  document.getElementById("detailStats").innerHTML = `
    <div class="detail-stat">
      <span class="detail-stat-label">VALEUR</span>
      <span class="detail-stat-val val ${it.rarity}">${fmtVal(it.value)}</span>
    </div>
    <div class="detail-stat">
      <span class="detail-stat-label">RARETÉ</span>
      <span class="detail-stat-val">${RARITY_LABEL[it.rarity]}</span>
    </div>
    <div class="detail-stat">
      <span class="detail-stat-label">TENDANCE</span>
      <span class="detail-stat-val" style="color:${trendCls}">${trendTxt}</span>
    </div>
    <div class="detail-stat">
      <span class="detail-stat-label">DEMANDE</span>
      <span class="detail-stat-val">${'★'.repeat(it.demand)}${'☆'.repeat(5-it.demand)} (${it.demand}/5)</span>
    </div>`;
  document.getElementById("detailPanel").classList.add("open");
  document.getElementById("detailOverlay").classList.add("open");
}
function closeDetail() {
  document.getElementById("detailPanel").classList.remove("open");
  document.getElementById("detailOverlay").classList.remove("open");
}
document.getElementById("detailClose").addEventListener("click", closeDetail);
document.getElementById("detailOverlay").addEventListener("click", closeDetail);

/* ─── BUILD FAMILIES ─── */
function buildFamilies(filter = "") {
  const grid = document.getElementById("familiesGrid");
  const q = filter.toLowerCase();
  const filtered = FAMILIES.filter(f => f.name.toLowerCase().includes(q) || RARITY_LABEL[f.rarity].toLowerCase().includes(q));
  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state"><div>🔍</div>Aucune famille trouvée.</div>`;
    return;
  }
  grid.innerHTML = filtered.map(f => `
    <div class="fam-card" style="--glow-color:${f.glow}">
      <div class="fam-name val ${f.rarity}">${f.name}</div>
      <span class="badge ${f.rarity}">${RARITY_LABEL[f.rarity]}</span>
      <div class="fam-val">Valeur N/A</div>
    </div>`).join("");
}

/* ─── TOAST ─── */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

/* ─── RARITY FILTERS ─── */
document.querySelectorAll("[data-rarity]").forEach(btn => {
  btn.addEventListener("click", () => {
    currentFilter = btn.dataset.rarity;
    document.querySelectorAll("[data-rarity]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    buildItems(document.getElementById("searchInput").value);
  });
});

/* ─── SORT ─── */
document.getElementById("sortSelect").addEventListener("change", function() {
  currentSort = this.value;
  buildItems(document.getElementById("searchInput").value);
});

/* ─── VIEW TOGGLE ─── */
document.getElementById("viewGrid").addEventListener("click", () => {
  currentView = "grid";
  document.getElementById("viewGrid").classList.add("active");
  document.getElementById("viewList").classList.remove("active");
  buildItems(document.getElementById("searchInput").value);
});
document.getElementById("viewList").addEventListener("click", () => {
  currentView = "list";
  document.getElementById("viewList").classList.add("active");
  document.getElementById("viewGrid").classList.remove("active");
  buildItems(document.getElementById("searchInput").value);
});

/* ─── TABS ─── */
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById("page-" + tab.dataset.page).classList.add("active");
    document.getElementById("searchInput").value = "";
    buildItems(); buildFamilies();
  });
});

/* ─── SEARCH ─── */
document.getElementById("searchInput").addEventListener("input", function() {
  const q = this.value;
  const activePage = document.querySelector(".tab.active").dataset.page;
  if (activePage === "items")    buildItems(q);
  if (activePage === "families") buildFamilies(q);
});

/* ─── CALCULATOR ─── */
const MAX = 9;
let youItems = [], themItems = [], modalTarget = null;

function renderSlots(side) {
  const items = side === "you" ? youItems : themItems;
  const grid  = document.getElementById(side + "Slots");
  grid.innerHTML = "";
  for (let i = 0; i < MAX; i++) {
    const slot = document.createElement("div");
    if (i < items.length) {
      slot.className = "slot filled";
      const it = items[i];
      slot.innerHTML = `<img src="${it.img}" alt="${it.name}" onerror="this.style.opacity=0.15">
        <div class="slot-name">${it.name}</div>
        <div class="slot-val">${fmtVal(it.value)}</div>
        <button class="slot-rm" data-side="${side}" data-i="${i}">✕</button>`;
    } else if (i === items.length && items.length < MAX) {
      slot.className = "slot";
      slot.innerHTML = `<span class="slot-plus">+</span><span>Ajouter</span>`;
      slot.addEventListener("click", () => openModal(side));
    } else {
      slot.className = "slot";
      slot.style.opacity = ".25";
      slot.style.cursor  = "default";
    }
    grid.appendChild(slot);
  }
  grid.querySelectorAll(".slot-rm").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      const s = btn.dataset.side, idx = +btn.dataset.i;
      (s === "you" ? youItems : themItems).splice(idx, 1);
      renderSlots(s); updateResult();
    });
  });
  updateResult();
}

function updateResult() {
  const sum = arr => arr.reduce((a,b) => a + (isFinite(b.value) ? b.value : 0), 0);
  const youInf  = youItems.some(i => !isFinite(i.value));
  const themInf = themItems.some(i => !isFinite(i.value));
  const yt = sum(youItems), tt = sum(themItems);

  document.getElementById("youTotal").textContent = youInf ? "INF" : fmtVal(yt);
  document.getElementById("themTotal").textContent = themInf ? "INF" : fmtVal(tt);
  document.getElementById("vsYou").textContent  = youInf ? "INF" : fmtVal(yt);
  document.getElementById("vsThem").textContent = themInf ? "INF" : fmtVal(tt);

  let yp = 50, tp = 50;
  const tot = yt + tt;
  if (tot > 0 && !youInf && !themInf) { yp = Math.round(yt/tot*100); tp = 100-yp; }
  else if (youInf && !themInf) { yp=80; tp=20; }
  else if (!youInf && themInf) { yp=20; tp=80; }

  document.getElementById("barYou").style.width  = yp + "%";
  document.getElementById("barThem").style.width = tp + "%";
  document.getElementById("barPctYou").textContent  = yp + "%";
  document.getElementById("barPctThem").textContent = tp + "%";

  // diff
  if (youItems.length === 0 && themItems.length === 0) {
    document.getElementById("diffVal").textContent = "—";
    document.getElementById("diffVal").style.color = "var(--muted)";
  } else if (youInf || themInf) {
    document.getElementById("diffVal").textContent = "∞";
    document.getElementById("diffVal").style.color = "var(--accent2)";
  } else {
    const diff = yt - tt;
    const sign = diff > 0 ? "+" : "";
    document.getElementById("diffVal").textContent = sign + fmtVal(Math.abs(diff)) + (diff < 0 ? " en ta défaveur" : diff > 0 ? " en ta faveur" : "");
    document.getElementById("diffVal").style.color = diff > 0 ? "var(--rise)" : diff < 0 ? "var(--fall)" : "var(--muted)";
  }

  const v = document.getElementById("verdict");
  if (youItems.length === 0 && themItems.length === 0) { v.className = "verdict fair"; v.textContent = "⚖ Équitable"; return; }
  const diff = youInf ? Infinity : themInf ? -Infinity : yt - tt;
  const pct  = tot > 0 ? Math.abs(diff)/tot : 0;
  if (Math.abs(diff) < 1 || pct < 0.05) { v.className = "verdict fair"; v.textContent = "⚖ Équitable"; }
  else if (diff < 0) { v.className = "verdict win";  v.textContent = "✅ Tu gagnes"; }
  else               { v.className = "verdict lose"; v.textContent = "❌ Tu perds"; }
}

/* ─── MODAL ─── */
function openModal(side) {
  modalTarget = side;
  document.getElementById("modalSearch").value = "";
  renderModalList("");
  document.getElementById("modalBg").classList.add("open");
  setTimeout(() => document.getElementById("modalSearch").focus(), 50);
}
function closeModal() { document.getElementById("modalBg").classList.remove("open"); }

document.getElementById("modalClose").addEventListener("click", closeModal);
document.getElementById("modalBg").addEventListener("click", e => { if (e.target === document.getElementById("modalBg")) closeModal(); });
document.getElementById("modalSearch").addEventListener("input", e => renderModalList(e.target.value));
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeModal(); closeDetail(); } });

function renderModalList(q) {
  const list = document.getElementById("modalList");
  const filtered = ITEMS.filter(it => it.name.toLowerCase().includes(q.toLowerCase()));
  if (filtered.length === 0) {
    list.innerHTML = `<div style="text-align:center;padding:20px;color:var(--muted);font-size:13px;">Aucun résultat</div>`;
    return;
  }
  list.innerHTML = filtered.map(it => `
    <div class="modal-item" data-idx="${ITEMS.indexOf(it)}">
      <img src="${it.img}" alt="${it.name}" onerror="this.style.opacity=0.15">
      <div class="modal-item-info">
        <div class="modal-item-name">${it.name}</div>
        <div class="modal-item-val">${fmtVal(it.value)}</div>
      </div>
      <span class="badge ${it.rarity}">${RARITY_LABEL[it.rarity]}</span>
    </div>`).join("");
  list.querySelectorAll(".modal-item").forEach(el => {
    el.addEventListener("click", () => {
      const it = ITEMS[+el.dataset.idx];
      const arr = modalTarget === "you" ? youItems : themItems;
      if (arr.length < MAX) arr.push(it);
      renderSlots(modalTarget);
      showToast(`${it.name} ajouté`);
      closeModal();
    });
  });
}

document.getElementById("resetBtn").addEventListener("click", () => {
  youItems = []; themItems = [];
  renderSlots("you"); renderSlots("them");
  showToast("Calculateur réinitialisé");
});

/* ─── INIT ─── */
buildStatsBar();
buildItems();
buildFamilies();
renderSlots("you");
renderSlots("them");
</script>
